version: '1.0'
services:
  app:
    container_name: next
    build:
      context: .
      dockerfile: docker/node/dev/Dockerfile
    depends_on:
      - postgres
      - meilisearch
    volumes:
      - .:/usr/src/app         # プロジェクト全体をマウント
      - /usr/src/app/node_modules        # node_modules はホストを無視
    env_file:
      - .env
    environment:
      - WATCHPACK_POLLING=true
    restart: always
    command: >
      sh -c "
      until nc -z postgres 5432; do
        sleep 1;
      done &&
      npx prisma generate &&
      npx prisma db push --force-reset --accept-data-loss &&
      npx prisma db seed &&
      npm run dev
      "
    networks:
      - mynet


  nginx:
    container_name: nginx
    image: nginx:latest
    ports:
      - "80:80"
    depends_on:
      - app
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - mynet

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mynet

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: meilisearch
    environment:
      - MEILI_MASTER_KEY=${MEILI_PASSWORD}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili_data:/meili_data
    networks:
      - mynet

volumes:
  postgres_data:
  meili_data:

networks:
  mynet:
    driver: bridge
