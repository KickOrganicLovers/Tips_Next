version: '1.0'
services:
  app:
    image: feetup/tips_next:latest
    container_name: next
#    ports:
#      - "5555:5555"
    build:
      context: .
      dockerfile: docker/node/prod/Dockerfile
    depends_on:
      - postgres
      - meilisearch
    env_file:
      - .env
    restart: always
    command: >
      sh -c "
      until nc -z postgres 5432; do
        sleep 1;
      done &&
      npx prisma db push &&
      npx prisma db seed &&
      npm run start
      "
    networks:
      - mynet


  nginx:
    container_name: nginx
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    volumes:
      - ./nginx/conf.d/nginx.prod.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - mynet

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - mynet

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mynet

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: meilisearch
    restart: always
    environment:
      - MEILI_MASTER_KEY=${MEILI_PASSWORD}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili_data:/meili_data
    networks:
      - mynet

volumes:
  postgres_data:
  meili_data:

networks:
  mynet:
    driver: bridge
